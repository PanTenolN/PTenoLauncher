name: Windows preview build and publication
on:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish the verified build as a development prerelease
        type: boolean
        default: false
  push:
    branches: [main, 'release/*']
    paths: ['src/**', 'tests/**', 'scripts/**', 'installer/**', '*.props', '*.json', '*.sln', 'NuGet.Config', '.github/workflows/windows-build.yml']
permissions:
  contents: read
concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Read release version
        id: release_version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content -LiteralPath Directory.Build.props -Raw)).Project.PropertyGroup.Version | Where-Object { $_ }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid project version.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build, test and package
        shell: pwsh
        env:
          PTENO_VERSION: ${{ steps.release_version.outputs.version }}
          PTENO_TEST_RUN_ID: ci-${{ github.run_id }}
        run: |
          $env:PATH += ';C:\Program Files (x86)\Inno Setup 6'
          ./scripts/build.ps1 -Publish -Installer -ReleaseSequence ([long]$env:GITHUB_RUN_ID) -BuildId $env:GITHUB_SHA
          $matrixReport = "artifacts/$env:PTENO_VERSION/java-matrix"
          New-Item -ItemType Directory -Path $matrixReport -Force | Out-Null
          try {
            dotnet tests/PTenoLauncher.IntegrationSmoke/bin/Release/net10.0/PTenoLauncher.IntegrationSmoke.dll .local/ci-java-matrix --java-matrix
            if ($LASTEXITCODE -ne 0) { throw 'Managed Java runtime matrix failed' }
          } finally {
            if (Test-Path -LiteralPath .local/ci-java-matrix) {
              Get-ChildItem -LiteralPath .local/ci-java-matrix -File |
                Where-Object { $_.Name -like 'java-*.json' -or $_.Name -like 'java-*.log' } |
                Copy-Item -Destination $matrixReport
            }
          }
          python scripts/verify-requirements.py
          python scripts/verify-packages.py --smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PTenoLauncher-windows-preview-${{ github.sha }}
          path: |
            artifacts/${{ steps.release_version.outputs.version }}/*.exe
            artifacts/${{ steps.release_version.outputs.version }}/*.zip
            artifacts/${{ steps.release_version.outputs.version }}/SHA256SUMS.txt
            artifacts/${{ steps.release_version.outputs.version }}/tests/*.trx
            artifacts/${{ steps.release_version.outputs.version }}/final-artifact-verification.json
            artifacts/${{ steps.release_version.outputs.version }}/java-matrix/*.json
            artifacts/${{ steps.release_version.outputs.version }}/java-matrix/*.log
          if-no-files-found: warn
  publish:
    needs: windows
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish_preview)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: PTenoLauncher-windows-preview-${{ github.sha }}
          path: preview
      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PTENO_COMMIT: ${{ github.sha }}
          PTENO_VERSION: ${{ needs.windows.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${PTENO_VERSION}-preview.${PTENO_COMMIT:0:12}"
          # Never overwrite an existing preview or present it as a stable release.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Preview already exists: $tag"
            exit 0
          fi
          gh release create "$tag" \
            "preview/PTenoLauncher-Setup-${PTENO_VERSION}-win-x64.exe" \
            "preview/PTenoLauncher-Portable-${PTENO_VERSION}-win-x64.zip" \
            "preview/PTenoLauncher-Source-${PTENO_VERSION}.zip" \
            preview/SHA256SUMS.txt \
            --target "$PTENO_COMMIT" --prerelease --latest=false \
            --title "PTenoLauncher ${PTENO_VERSION} Development Preview (${PTENO_COMMIT:0:12})" \
            --notes-file docs/PREVIEW_RELEASE.md
